name: Serverless release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          version="$(tr -d '[:space:]' < VERSION)"
          test "$base" = "$version" || {
            echo "::error::Bump VERSION to match the release tag."
            exit 1
          }

  build:
    needs: version-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build DynamoDB-backed Lambda archives
        run: bash infra/aws/scripts/build-lambdas.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beepbite-lambda-archives
          path: infra/aws/artifacts/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beepbite-lambda-archives
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
