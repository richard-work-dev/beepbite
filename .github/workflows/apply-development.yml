name: Apply reviewed development plan

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Run ID of the successful Plan development deployment workflow
        required: true
        type: string
      source_commit:
        description: Exact commit SHA shown by that plan workflow
        required: true
        type: string
      allow_destroy:
        description: Confirm only if you reviewed and authorize resource destruction/replacement in plan.txt
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: beepbite-development-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the selected reviewed plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: development
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_profile: ""
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: dev
      TF_VAR_enable_custom_domains: "true"
      TF_VAR_single_store_enabled: ${{ vars.SINGLE_STORE_ENABLED }}
      TF_VAR_single_store_owner_email: ${{ vars.SINGLE_STORE_OWNER_EMAIL }}
      TF_VAR_single_store_name: ${{ vars.SINGLE_STORE_NAME }}
      TF_VAR_single_store_country: ${{ vars.SINGLE_STORE_COUNTRY }}
      TF_VAR_single_store_city: ${{ vars.SINGLE_STORE_CITY }}
      TF_VAR_single_store_address: ${{ vars.SINGLE_STORE_ADDRESS }}
      TF_VAR_single_store_time_zone: ${{ vars.SINGLE_STORE_TIME_ZONE }}
      TF_VAR_single_store_currency: ${{ vars.SINGLE_STORE_CURRENCY }}
      TF_VAR_single_store_tax_rate: ${{ vars.SINGLE_STORE_TAX_RATE }}
      TF_VAR_single_store_tax_inclusive: ${{ vars.SINGLE_STORE_TAX_INCLUSIVE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
      - name: Verify this is the exact planned commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: beepbite-apply-${{ github.run_id }}
      - name: Initialize Terraform
        working-directory: infra/aws
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - uses: actions/download-artifact@v4
        with:
          name: development-plan
          path: infra/aws
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact provenance and inspect changes
        working-directory: infra/aws
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          set -euo pipefail
          test "$(cat plan-commit.txt)" = "$EXPECTED_COMMIT"
          test -s development.tfplan
          test -s plan.txt
          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq 'will be destroyed|must be replaced|Plan: [0-9]+ to add, [0-9]+ to change, [1-9][0-9]* to destroy' plan.txt; then
            if [[ "$ALLOW_DESTROY" != "true" ]]; then
              echo "::error::The plan destroys or replaces infrastructure. Review plan.txt and dispatch again with allow_destroy=true only if that change is intentional."
              exit 1
            fi
            echo "Destructive/replacement changes explicitly confirmed for this reviewed plan."
          fi
      - name: Apply selected Terraform plan
        working-directory: infra/aws
        run: terraform apply -input=false development.tfplan
      - name: Read deployment outputs
        id: infrastructure
        working-directory: infra/aws
        shell: bash
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw frontend_distribution_id)" >> "$GITHUB_OUTPUT"
      - name: Build frontend
        working-directory: web
        env:
          VITE_API_URL: ${{ steps.infrastructure.outputs.api_url }}
        run: |
          npm ci
          npm run build:dev
      - name: Publish frontend
        shell: bash
        run: |
          set -euo pipefail
          bucket="s3://${{ steps.infrastructure.outputs.frontend_bucket }}"
          aws s3 sync web/dist "$bucket" --delete --exclude index.html --exclude sw.js \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "$bucket/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp web/dist/sw.js "$bucket/sw.js" \
            --content-type "application/javascript" \
            --cache-control "no-cache, no-store, must-revalidate"
      - name: Invalidate CloudFront
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infrastructure.outputs.distribution_id }}" \
            --paths "/*" --query 'Invalidation.Id' --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.infrastructure.outputs.distribution_id }}" \
            --id "$invalidation_id"
      - name: Smoke test API and frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            "${{ steps.infrastructure.outputs.api_url }}/api/health" >/dev/null
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            "${{ steps.infrastructure.outputs.api_url }}/api/ready" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 10 \
            "${{ steps.infrastructure.outputs.frontend_url }}/" >/dev/null
      - name: Deployment summary
        run: |
          {
            echo "### Development deployed"
            echo "- Frontend: ${{ steps.infrastructure.outputs.frontend_url }}"
            echo "- API: ${{ steps.infrastructure.outputs.api_url }}"
            echo "- Commit: \`${{ inputs.source_commit }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
