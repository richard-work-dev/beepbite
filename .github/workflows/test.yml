name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  serverless:
    name: Lambda build, vet and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Build serverless functions
        run: go build -tags lambda.norpc ./cmd/serverless/...
      - name: Vet serverless functions and shared packages
        run: go vet ./cmd/serverless/... ./pkg/...
      - name: Test serverless functions and shared packages
        run: go test ./cmd/serverless/... ./pkg/...
      - name: Package Lambda artifacts
        working-directory: .
        run: bash infra/aws/scripts/build-lambdas.sh

  frontend:
    name: Frontend build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Docs mirror in sync
        run: npm run docs:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Typecheck CI scripts
        run: npm run typecheck:scripts
      - name: Lint config validation
        run: npm run check:lint-config
      - name: Vite build
        run: npm run build
      - name: Vitest unit tests
        run: npm run test:unit

  verify-script:
    name: Release verifier checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n scripts/verify.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh
      - name: Failure matrix
        run: bash scripts/verify.sh --selftest
