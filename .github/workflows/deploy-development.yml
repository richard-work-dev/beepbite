name: Plan development deployment

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful plan run to apply; leave empty to generate a plan only
        required: false
        type: string
      source_commit:
        description: Exact commit from the selected plan (required when applying)
        required: false
        type: string
      allow_destroy:
        description: Authorize only the destruction/replacement reviewed in the selected plan
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: beepbite-development-plan
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.plan_run_id == '' }}
    name: Plan AWS development (no apply)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_profile: ""
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: dev
      TF_VAR_enable_custom_domains: "true"
      TF_VAR_single_store_enabled: ${{ vars.SINGLE_STORE_ENABLED }}
      TF_VAR_single_store_owner_email: ${{ vars.SINGLE_STORE_OWNER_EMAIL }}
      TF_VAR_single_store_name: ${{ vars.SINGLE_STORE_NAME }}
      TF_VAR_single_store_country: ${{ vars.SINGLE_STORE_COUNTRY }}
      TF_VAR_single_store_city: ${{ vars.SINGLE_STORE_CITY }}
      TF_VAR_single_store_address: ${{ vars.SINGLE_STORE_ADDRESS }}
      TF_VAR_single_store_time_zone: ${{ vars.SINGLE_STORE_TIME_ZONE }}
      TF_VAR_single_store_currency: ${{ vars.SINGLE_STORE_CURRENCY }}
      TF_VAR_single_store_tax_rate: ${{ vars.SINGLE_STORE_TAX_RATE }}
      TF_VAR_single_store_tax_inclusive: ${{ vars.SINGLE_STORE_TAX_INCLUSIVE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: beepbite-plan-${{ github.run_id }}
      - name: Build ARM64 Lambda archives
        run: bash infra/aws/scripts/build-lambdas.sh
      - name: Initialize Terraform
        working-directory: infra/aws
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Validate Terraform
        working-directory: infra/aws
        run: |
          terraform fmt -check -recursive
          terraform validate
      - name: Create and summarize plan (never applies)
        working-directory: infra/aws
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -out=development.tfplan
          terraform show -no-color development.tfplan | tee plan.txt
          printf '%s\n' "$GITHUB_SHA" > plan-commit.txt
          {
            echo "### Development plan ready for review"
            echo "Commit: \`$GITHUB_SHA\`"
            grep -E '^Plan:|^No changes\.' plan.txt || true
            echo "Review the \`development-plan\` artifact. Applying is a separate manual workflow."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: development-plan
          path: |
            infra/aws/development.tfplan
            infra/aws/plan.txt
            infra/aws/plan-commit.txt
            infra/aws/artifacts/*.zip
          if-no-files-found: error
          retention-days: 2

  apply:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_run_id != '' }}
    uses: ./.github/workflows/apply-development.yml
    with:
      plan_run_id: ${{ inputs.plan_run_id }}
      source_commit: ${{ inputs.source_commit }}
      allow_destroy: ${{ inputs.allow_destroy }}
