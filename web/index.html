<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>RikoPollo | Pollo al espiedo y broaster en Misiones</title>
    <meta name="description" content="RikoPollo: pollo al espiedo, pollo broaster y combos para llevar en Misiones. Consultá el menú, los horarios y pedí por WhatsApp." />
    <meta name="keywords" content="RikoPollo, pollo al espiedo, pollo broaster, comida para llevar, Misiones, Argentina" />
    <meta name="author" content="RikoPollo" />
    <meta name="robots" content="index, follow" />

    <!--
      No canonical or absolute og:url here on purpose. This is the app shell
      of a self-hosted product: every deployment lives on the operator's own
      hostname, so a canonical pointing at one domain would tell crawlers that
      every restaurant's till belongs to somebody else's site. (It used to
      point at beepbite.io, which nobody operates.) The marketing page that
      *does* have a canonical home is site/index.html.
    -->

    <!-- Favicons -->
    <link rel="icon" type="image/jpeg" href="/rikopollo/logo.jpeg" />
    <link rel="apple-touch-icon" href="/rikopollo/logo.jpeg" />

    <!-- Open Graph / Facebook — relative image, host-agnostic -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RikoPollo | Sabor que da gusto" />
    <meta property="og:description" content="Pollo al espiedo, broaster y combos para llevar en Misiones. Pedí por WhatsApp." />
    <meta property="og:image" content="/rikopollo/menu.jpeg" />
    <meta property="og:site_name" content="RikoPollo" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="RikoPollo | Sabor que da gusto" />
    <meta property="twitter:description" content="Pollo al espiedo, broaster y combos para llevar en Misiones. Pedí por WhatsApp." />
    <meta property="twitter:image" content="/rikopollo/menu.jpeg" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#17120f" />
    <meta name="application-name" content="RikoPollo" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
